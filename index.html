<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Shelf</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #DFF1F1; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        .search-section, .library-section { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; }

        .search-control {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            padding: 12px;
            width: min(70%, 500px);
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input:focus { border-color: #007bff; }

        button { padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
        button:hover { background: #0056b3; }

        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px; }

        /* Карточка книги */
        .book-card {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .book-card:hover { transform: translateY(-5px); }

        .book-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            background: #ddd;
            flex-shrink: 0;
            display: block;
        }

        .book-card p {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            height: 40px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-card small {
            color: #666;
            font-size: 12px;
            min-height: 16px;
        }

        .btn-add { background: #28a745; font-size: 13px; width: 100%; }
        .btn-remove { background: #dc3545; font-size: 13px; width: 100%; margin-top: auto; }

        .rating-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            flex-direction: row;
            direction: ltr;
        }

        .book-card:hover .rating-overlay { opacity: 1; }

        .star {
            cursor: pointer;
            font-size: 25px;
            color: #ccc;
            transition: color 0.2s;
        }

        .rating-overlay:has(.star:hover) .star:hover,
        .rating-overlay:has(.star:hover) .star:has(~ .star:hover) {
            color: #ffc107;
        }

        .star.active { color: #ffc107; }

        .stars-display {
            color: #ffc107;
            font-size: 16px;
            margin-bottom: 5px;
            min-height: 20px;
        }

        .status-text {
            margin-top: 12px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Поиск книг</h1>
    
    <div class="search-control">
        <input type="text" id="searchInput" placeholder="Введите название книги или автора">
        <button onclick="searchBooks()">Найти</button>
    </div>

    <div id="searchStatus" class="status-text"></div>
    <div id="searchResults" class="book-grid"></div>

    <hr>

    <h2>📖 Моя библиотека</h2>
    <div id="library" class="book-grid"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', renderLibrary);

const DEFAULT_COVER = 'https://placehold.co/150x220?text=No+Cover';

async function searchBooks() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    const resultsDiv = document.getElementById('searchResults');
    const statusDiv = document.getElementById('searchStatus');
    resultsDiv.innerHTML = '';
    statusDiv.textContent = 'Ищу в мировых библиотеках...';

    try {
        const sources = [
            searchOpenLibrary(query),
            searchGoogleBooks(query),
            searchInternetArchive(query),
            searchGutendex(query)
        ];

        const results = await Promise.allSettled(sources);

        const allResults = [];
        results.forEach(r => {
            if (r.status === 'fulfilled' && Array.isArray(r.value)) {
                allResults.push(...r.value);
            }
        });

        const unique = [];
        const seen = new Set();

        for (const book of allResults) {
            const key = `${(book.title || '').toLowerCase()}__${(book.author || '').toLowerCase()}`;
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(book);
            }
        }

        statusDiv.textContent = '';

        if (unique.length === 0) {
            resultsDiv.innerHTML = '<p>Книги не найдены.</p>';
            return;
        }

        unique.slice(0, 24).forEach(book => {
            const title = book.title || 'Без названия';
            const author = book.author || '';
            const thumbnail = book.thumbnail || DEFAULT_COVER;

            const card = document.createElement('div');
            card.className = 'book-card';
            card.innerHTML = `
                <img src="${thumbnail}" alt="${escapeHtml(title)}" onerror="this.onerror=null;this.src='${DEFAULT_COVER}';">
                <p>${escapeHtml(title)}</p>
                ${author ? `<small>${escapeHtml(author)}</small>` : `<small>&nbsp;</small>`}
                <button class="btn-add" onclick="addToLibrary('${escapeJs(title)}', '${escapeJs(thumbnail)}')">В прочитанное</button>
            `;
            resultsDiv.appendChild(card);
        });

    } catch (error) {
        console.error('Ошибка поиска:', error);
        statusDiv.textContent = '';
        resultsDiv.innerHTML = '<p>Ошибка при подключении к библиотекам.</p>';
    }
}

async function searchOpenLibrary(query) {
    try {
        const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=20`;
        const response = await fetch(url);
        if (!response.ok) return [];
        const data = await response.json();

        if (!data.docs || !data.docs.length) return [];

        return data.docs.map(doc => {
            const title = doc.title || 'Без названия';
            const author = Array.isArray(doc.author_name) ? doc.author_name.join(', ') : '';
            const coverId = doc.cover_i;
            const thumbnail = coverId
                ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                : DEFAULT_COVER;

            return { title, author, thumbnail };
        });
    } catch (e) {
        console.error('OpenLibrary error:', e);
        return [];
    }
}

async function searchGoogleBooks(query) {
    try {
        const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=20&printType=books&projection=lite`;
        const response = await fetch(url);
        if (!response.ok) return [];
        const data = await response.json();

        if (!data.items || !data.items.length) return [];

        return data.items.map(item => {
            const info = item.volumeInfo || {};
            const title = info.title || 'Без названия';
            const author = Array.isArray(info.authors) ? info.authors.join(', ') : '';
            const thumbnail =
                (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) ||
                DEFAULT_COVER;

            return { title, author, thumbnail };
        });
    } catch (e) {
        console.error('Google Books error:', e);
        return [];
    }
}

async function searchInternetArchive(query) {
    try {
        const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}+AND+mediatype%3Atexts&fl[]=title,creator,identifier&rows=20&page=1&output=json`;
        const response = await fetch(url);
        if (!response.ok) return [];
        const data = await response.json();

        const docs = data?.response?.docs || [];
        if (!docs.length) return [];

        return docs.map(doc => {
            const title = doc.title || 'Без названия';
            const author = doc.creator || '';
            const thumbnail = doc.identifier
                ? `https://archive.org/services/img/${encodeURIComponent(doc.identifier)}`
                : DEFAULT_COVER;

            return { title, author, thumbnail };
        });
    } catch (e) {
        console.error('Internet Archive error:', e);
        return [];
    }
}

async function searchGutendex(query) {
    try {
        const url = `https://gutendex.com/books?search=${encodeURIComponent(query)}`;
        const response = await fetch(url);
        if (!response.ok) return [];
        const data = await response.json();

        if (!data.results || !data.results.length) return [];

        return data.results.map(book => {
            const title = book.title || 'Без названия';
            const author = Array.isArray(book.authors) && book.authors.length
                ? book.authors.map(a => a.name).join(', ')
                : '';
            const thumbnail = book.formats?.['image/jpeg'] || DEFAULT_COVER;

            return { title, author, thumbnail };
        });
    } catch (e) {
        console.error('Gutendex error:', e);
        return [];
    }
}

function addToLibrary(title, img) {
    const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
    if (library.some(book => book.title === title)) {
        alert('Эта книга уже в списке!');
        return;
    }
    library.push({ title, img, rating: 0 });
    localStorage.setItem('myLibrary', JSON.stringify(library));
    renderLibrary();
}

function removeFromLibrary(index) {
    const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
    library.splice(index, 1);
    localStorage.setItem('myLibrary', JSON.stringify(library));
    renderLibrary();
}

function setRating(index, rating) {
    const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
    if (!library[index]) return;
    library[index].rating = rating;
    localStorage.setItem('myLibrary', JSON.stringify(library));
    renderLibrary();
}

function renderLibrary() {
    const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
    const libraryDiv = document.getElementById('library');
    libraryDiv.innerHTML = '';

    if (library.length === 0) {
        libraryDiv.innerHTML = '<p>Список пуст. Начните поиск!</p>';
        return;
    }

    library.forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card';

        let starsHTML = `<div class="rating-overlay">`;
        for (let i = 1; i <= 5; i++) {
            starsHTML += `<span class="star" onclick="setRating(${index}, ${i})">★</span>`;
        }
        starsHTML += `</div>`;

        const ratingStars = book.rating > 0 ? '★'.repeat(book.rating) : '';

        card.innerHTML = `
            ${starsHTML}
            <img src="${book.img}" alt="${escapeHtml(book.title)}" onerror="this.onerror=null;this.src='${DEFAULT_COVER}';">
            <div class="stars-display">${ratingStars}</div>
            <p>${escapeHtml(book.title)}</p>
            <button class="btn-remove" onclick="removeFromLibrary(${index})">Удалить</button>
        `;
        libraryDiv.appendChild(card);
    });
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function escapeJs(str) {
    return String(str)
        .replace(/\/g, '\\')
        .replace(/'/g, "\'")
        .replace(/
/g, ' ');
}
</script>

</body>
</html>
