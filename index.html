<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Shelf</title>
    <!-- Подключение Font Awesome для иконок сердечек -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Подключение шрифтов Archivo Black и Dela Gothic One из Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #DFF1F1; padding: 20px; color: #333; }
        
        /* Стили для заголовка MyBooks (остаются исходными для десктопа) */
        .site-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 92px; 
            color: #7F2020;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -7px;
            text-transform: uppercase;
        }

        /* Заголовки разделов («Моя библиотека», «Избранное») с новым шрифтом */
        h2 {
            font-family: 'Dela Gothic One', sans-serif;
            font-size: 28px;
            color: #333;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        /* Контейнер для инпута и крестика */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 70%; 
        }

        /* Стиль крестика */
        #clearSearchBtn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 25px;
            display: none; 
            user-select: none;
            align-items: center;
            justify-content: center;
        }

        #clearSearchBtn:hover { color: #333; }
        .container { max-width: 900px; margin: 0 auto; }

        /* Строка поиска: */
        .search-control {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center; 
            max-width: 800px;        
            margin: 0 auto 25px auto; 
            width: 100%;
        }
        .search-input-wrapper {
            position: relative;
            flex: 1;                 
            min-width: 250px;        
            display: flex;
            align-items: center;
        }
        .search-input-wrapper input {
            width: 100%;             
            padding: 12px 40px 12px 20px; 
            border: 0px solid #ddd;
            border-radius: 20px; 
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
            background: white;
            font-size: 15px;
        }
        .search-section, .library-section { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; justify-content: center; }
        input { padding: 12px; width: 70%; border: 0px solid #ddd; border-radius: 16px; outline: none; transition: border-color 0.3s; }
        button { padding: 12px 24px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        
        /* Сетка карточек для ПК (исходная) */
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-top: 20px; }
        
        /* Делает надпись о пустом списке во всю ширину экрана */
        .book-grid > p {
            grid-column: 1 / -1;
            font-size: 15px;
            color: #666;
            text-align: left;
        }

        /* Прозрачная кнопка-лайк в углу картинки */
        .book-card .btn-like {
            position: absolute;
            top: 18px;
            right: 22px;
            background: transparent !important; 
            border: none !important;            
            width: auto !important;
            height: auto !important;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 22px;            
            color: #000000;             
            transition: transform 0.2s ease, color 0.2s ease;
            z-index: 10;
            padding: 0 !important;
        }

        .book-card .btn-like:hover { transform: scale(1.15); }
        .book-card .btn-like.active { color: #ff4757; }
        .book-card .btn-like i { display: block; line-height: 1; }

        /* Карточка книги */
        .book-card { background: #fff; border: 1px solid #eee; padding: 15px; text-align: center; border-radius: 10px; transition: transform 0.2s; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; min-height: 330px; box-sizing: border-box; }
        .book-card:hover { transform: translateY(-5px); }
        .book-card img { 
            width: 100%; 
            height: auto; 
            aspect-ratio: 2 / 3;
            object-fit: cover; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            background: #ddd;
            flex-shrink: 0;
            display: block;
            text-indent: -10000px;
        }

        .book-card img:not([src]), 
        .book-card img[src=""], 
        .book-card img[src="undefined"],
        .book-card img:invalid {
            visibility: hidden;
        }

        .book-card p { font-size: 14px; font-weight: 600; margin: 10px 0 2px 0; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        /* Стили для автора книги */
        .book-author { font-size: 12px; color: #666; font-weight: 400; margin: 0 0 10px 0; height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .btn-add { background: #28a745; font-size: 13px; width: 100%; white-space: nowrap; padding: 12px 0; text-align: center; }
        
        /* Стиль для кнопки, когда книга уже добавлена */
        .btn-added { background: #0056b3; font-size: 13px; width: 100%; white-space: nowrap; padding: 12px 0; text-align: center; }
        .btn-added:hover { background: #004085; }

        .btn-remove { background: #dc3545; font-size: 13px; width: 100%; margin-top: auto; padding: 12px 0; text-align: center; }
        .btn-remove:hover {  background: #bd2130; }  
        
        /* Панель рейтинга */
        .rating-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            flex-direction: row;        
            direction: ltr;
            pointer-events: none; /* Отключаем на ПК по умолчанию, активируем при ховере */
        }
        
        /* На ПК рейтинг всплывает строго при наведении на саму карточку */
        .book-card:hover .rating-overlay { opacity: 1; pointer-events: auto; }
        .star { cursor: pointer; font-size: 25px; color: #ccc; transition: color 0.2s; }
        
        /* Подсветка звёзд при наведении (только если нет наведения на конкретную звезду) */
        .rating-overlay:has(.star:hover) .star:hover,
        .rating-overlay:has(.star:hover) .star:has(~ .star:hover) { color: #ffc107 !important; }
        
        /* Сброс цвета остальных звёзд при наведении, чтобы подсвечивались строго до курсора */
        .rating-overlay:has(.star:hover) .star:hover ~ .star { color: #ccc !important; }

        .star.active { color: #ffc107; }
        .stars-display { color: #ffc107; font-size: 16px; margin-bottom: 5px; min-height: 20px; }

        /* СТИЛИ ДЛЯ КАРТОЧКИ-ПЛЮСА */
        .add-card-btn {
            border: 2px solid #8CC0EB;
            background: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-height: 330px;
        }
        .add-card-btn:hover {
            background: #ffffff;
            border-color: #007bff;
        }
        .add-card-btn .plus-icon {
            font-size: 50px;
            color: #8CC0EB;
            transition: color 0.2s;
        }
        .add-card-btn:hover .plus-icon {
            color: #007bff;
        }

        /* СТИЛИ ДЛЯ МОДАЛЬНОГО ОКНА */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 100; 
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        .modal-content input { width: 100%; margin-bottom: 15px; border: 1px solid #ddd; padding: 12px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn-cancel { background: #6c757d; }
        .btn-cancel:hover { background: #5a6268; }
        .close-modal {
            position: absolute; right: 15px; top: 10px;
            font-size: 24px; cursor: pointer; color: #aaa;
        }
        .close-modal:hover { color: #333; }

        /* ==========================================================================
           📱 ОТДЕЛЬНЫЕ СТИЛИ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ (ЭКРАНЫ МЕНЕЕ 768px)
           ========================================================================== */
        @media (max-width: 767px) {
            .site-header {
                font-size: 48px;
                letter-spacing: -3px;
                margin-bottom: 20px;
            }

            h2 {
                font-size: 22px;
                text-align: center;
                margin-top: 30px;
            }

            .search-control {
                padding: 0 10px;
                box-sizing: border-box;
            }

            .search-input-wrapper input {
                font-size: 16px; /* Защита от принудительного зума в iOS Safari */
            }

            /* На телефонах сетка автоматически строится в две адаптивные колонки */
            .book-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
                padding: 0 10px;
            }

            .book-card {
                min-height: 310px;
                padding: 10px;
            }

            .add-card-btn {
                min-height: 310px;
            }

            /* На тач-скринах убираем :hover-эффект всплытия рейтинга, 
               чтобы он не перекрывал клики, и переключаем его через класс .show-rating */
            .book-card:hover .rating-overlay {
                opacity: 0;
                pointer-events: none;
            }

            .book-card.show-rating .rating-overlay {
                opacity: 1 !important;
                pointer-events: auto !important;
            }
            
            #clearSearchBtn {
                right: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="site-header">Bookish</div>
    
    <div class="search-control">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Введите название книги ...">
            <span id="clearSearchBtn" onclick="clearSearch(event)">&times;</span>
        </div>
        <button onclick="searchBooks()">Найти</button>
    </div>

    <div id="searchResults" class="book-grid"></div>

    <h2>Моя библиотека</h2>
    <div id="library" class="book-grid"></div>

    <h2>Избранное</h2>
    <div id="favorites" class="book-grid"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ДЛЯ ДОБАВЛЕНИЯ СВОЕЙ КНИГИ -->
<div id="addBookModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3>Добавить свою книгу</h3>
        <input type="text" id="customTitle" placeholder="Название книги (обязательно)">
        <input type="text" id="customAuthor" placeholder="Автор книги (необязательно)">
        <input type="text" id="customCover" placeholder="Ссылка на URL обложки (необязательно)">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Отмена</button>
            <button onclick="saveCustomBook()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        renderLibrary();
        renderFavorites(); 
    });

    function debounce(func, delay) {
        let timeoutId;
        return (...args) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => func(...args), delay);
        };
    }

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', debounce(() => {
                searchBooks();
            }, 500));
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    searchBooks();
                }
            });
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        if (searchInput && clearBtn) {
            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim().length > 0) {
                    clearBtn.style.display = 'flex'; 
                } else {
                    clearBtn.style.display = 'none';  
                }
            });
        }
    });

    function clearSearch(event) {
        if(event) event.stopPropagation();
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');
        if (searchInput) {
            searchInput.value = ''; 
            searchInput.focus();    
        }
        if (clearBtn) {
            clearBtn.style.display = 'none'; 
        }
        searchBooks(); 
    }

    async function searchBooks() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('searchResults');
        
        if (!query) {
            if (resultsDiv) resultsDiv.innerHTML = '';
            return;
        }

        if (resultsDiv) resultsDiv.innerHTML = '';

        try {
            const googleUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}`;
            const response = await fetch(googleUrl);
            const data = await response.json();

            if (data.items && data.items.length > 0) {
                renderResults(data.items.slice(0, 20), 'google');
                return; 
            } else {
                await searchOpenLibrary(query); 
            }
        } catch (error) {
            console.error('Ошибка Google Books, переключаюсь на Open Library:', error);
            await searchOpenLibrary(query);
        }
    }

    async function searchOpenLibrary(query) {
        const resultsDiv = document.getElementById('searchResults');
        try {
            const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            const data = await response.json();

            if (!data.docs || data.docs.length === 0) {
                resultsDiv.innerHTML = '<p>Ни в одной библиотеке ничего не найдено.</p>';
                return;
            }

            const formattedDocs = data.docs.slice(0, 20).map(doc => ({
                title: doc.title,
                author_name: doc.author_name ? doc.author_name.join(', ') : 'Неизвестный автор',
                cover_i: doc.cover_i,
                isGoogle: false
            }));

            renderResults(formattedDocs, 'openlib');
        } catch (error) {
            console.error('Ошибка Open Library:', error);
            resultsDiv.innerHTML = '<p>Ошибка при поиске во всех источниках.</p>';
        }
    }

    // Вспомогательная функция для переключения отображения рейтинга по тапу на мобилках
    function handleCardTap(cardElement, event) {
        // Если клик пришелся на интерактивную кнопку, не переключаем оверлей
        if (event.target.closest('button') || event.target.closest('.star') || event.target.closest('#clearSearchBtn')) {
            return;
        }
        
        // Только для мобильных разрешений переключаем класс
        if (window.innerWidth < 768) {
            const currentActive = document.querySelector('.book-card.show-rating');
            if (currentActive && currentActive !== cardElement) {
                currentActive.classList.remove('show-rating');
            }
            cardElement.classList.toggle('show-rating');
        }
    }

    function renderResults(items, source) {
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';

        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];

        items.forEach(item => {
            let title, author, thumbnail;

            if (source === 'google') {
                const info = item.volumeInfo;
                title = info.title;
                author = info.authors ? info.authors.join(', ') : 'Неизвестный автор';
                thumbnail = info.imageLinks && info.imageLinks.thumbnail 
                    ? info.imageLinks.thumbnail.replace('http:', 'https:') 
                    : 'https://via.placeholder.com/150x220?text=Нет+обложки';
            } else {
                title = item.title;
                author = item.author_name;
                thumbnail = item.cover_i 
                    ? `https://covers.openlibrary.org/b/id/${item.cover_i}-M.jpg` 
                    : 'https://via.placeholder.com/150x220?text=Нет+обложки';
            }

            const card = document.createElement('div');
            card.className = 'book-card';
            card.setAttribute('onclick', 'handleCardTap(this, event)');
            
            const favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
            const isLiked = favorites.some(fav => fav.title === title);
            const safeTitle = title.replace(/'/g, "\'");
            const safeAuthor = author.replace(/'/g, "\'");

            const isAdded = library.some(book => book.title === title);
            const buttonClass = isAdded ? 'btn-added' : 'btn-add';
            const buttonText = isAdded ? 'Прочитано' : 'В прочитанное';

            card.innerHTML = `
                <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike('${safeTitle}', '${safeAuthor}', '${thumbnail}', this); event.stopPropagation();">
                    <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <img src="${thumbnail}" alt="${title}">
                <p>${title}</p>
                <div class="book-author">${author}</div>
                <button class="${buttonClass}" onclick="toggleLibraryBook('${safeTitle}', '${safeAuthor}', '${thumbnail}', this); event.stopPropagation();">${buttonText}</button>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function toggleLibraryBook(title, author, img, buttonElement) {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        const index = library.findIndex(book => book.title === title);

        if (index === -1) {
            library.push({ title, author, img, rating: 0 });
            localStorage.setItem('myLibrary', JSON.stringify(library));
            
            if (buttonElement) {
                buttonElement.className = 'btn-added';
                buttonElement.textContent = 'Прочитано';
            }
        } else {
            library.splice(index, 1);
            localStorage.setItem('myLibrary', JSON.stringify(library));
            
            if (buttonElement) {
                buttonElement.className = 'btn-add';
                buttonElement.textContent = 'В прочитанное';
            }
        }
        
        renderLibrary();
    }

    function removeFromLibrary(index, event) {
        if(event) event.stopPropagation();
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        library.splice(index, 1);
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderLibrary();
        searchBooks();
    }

    function setRating(index, rating, event) {
        if(event) event.stopPropagation();
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        library[index].rating = rating;
        localStorage.setItem('myLibrary', JSON.stringify(library));
        renderLibrary();
    }

    function renderLibrary() {
        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        const libraryDiv = document.getElementById('library');
        if (!libraryDiv) return;
        libraryDiv.innerHTML = '';

        library.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.setAttribute('onclick', 'handleCardTap(this, event)');
            
            let starsHTML = `<div class="rating-overlay">`;
            for (let i = 1; i <= 5; i++) {
                const isActive = i <= book.rating ? 'active' : '';
                starsHTML += `<span class="star ${isActive}" onclick="setRating(${index}, ${i}, event)">★</span>`;
            }
            starsHTML += `</div>`;

            const ratingStars = book.rating > 0 ? '★'.repeat(book.rating) : '';
            const favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
            const isLiked = favorites.some(fav => fav.title === book.title);

            const bookAuthor = book.author || 'Неизвестный автор';
            const safeTitle = book.title.replace(/'/g, "\'");
            const safeAuthor = bookAuthor.replace(/'/g, "\'");

            card.innerHTML = `
                ${starsHTML}
                <button class="btn-like ${isLiked ? 'active' : ''}" onclick="toggleLike('${safeTitle}', '${safeAuthor}', '${book.img}', this); event.stopPropagation();">
                    <i class="${isLiked ? 'fas' : 'far'} fa-heart"></i>
                </button>
                <img src="${book.img}" alt="${book.title}">
                <div class="stars-display">${ratingStars}</div>
                <p>${book.title}</p>
                <div class="book-author">${bookAuthor}</div>
                <button class="btn-remove" onclick="removeFromLibrary(${index}, event)">Удалить</button>
            `;
            libraryDiv.appendChild(card);
        });

        const addCard = document.createElement('div');
        addCard.className = 'book-card add-card-btn';
        addCard.onclick = openModal;
        addCard.innerHTML = `<div class="plus-icon"><i class="fas fa-plus"></i></div>`;
        libraryDiv.appendChild(addCard);
    }

    function openModal() {
        document.getElementById('addBookModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('addBookModal').style.display = 'none';
        document.getElementById('customTitle').value = '';
        document.getElementById('customAuthor').value = '';
        document.getElementById('customCover').value = '';
    }

    function saveCustomBook() {
        const title = document.getElementById('customTitle').value.trim();
        let author = document.getElementById('customAuthor').value.trim();
        let img = document.getElementById('customCover').value.trim();

        if (!title) {
            alert('Пожалуйста, введите название книги!');
            return;
        }

        if (!author) {
            author = 'Собственный автор';
        }

        if (!img) {
            img = 'https://via.placeholder.com/150x220?text=%D0%A1%D0%B2%D0%BE%D1%8F+%D0%BE%D0%B1%D0%BB%D0%BE%D0%B6%D0%BA%D0%B0';
        }

        const library = JSON.parse(localStorage.getItem('myLibrary')) || [];
        
        if (library.some(book => book.title === title)) {
            alert('Книга с таким названием уже есть в вашей библиотеке!');
            return;
        }

        library.push({ title, author, img, rating: 0 });
        localStorage.setItem('myLibrary', JSON.stringify(library));
        
        renderLibrary();
        closeModal();
    }

    function toggleLike(title, author, img, buttonElement) {
        let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
        const index = favorites.findIndex(book => book.title === title);
        const icon = buttonElement.querySelector('i');

        if (index === -1) {
            favorites.push({ title, author, img });
            buttonElement.classList.add('active');
            if (icon) {
                icon.classList.remove('far');
                icon.classList.add('fas');
            }
        } else {
            favorites.splice(index, 1);
            buttonElement.classList.remove('active');
            if (icon) {
                icon.classList.remove('fas');
                icon.classList.add('far');
            }
        }

        localStorage.setItem('myFavorites', JSON.stringify(favorites));
        renderFavorites();
        renderLibrary();
    }

    function renderFavorites() {
        const favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
        const favoritesDiv = document.getElementById('favorites');
        if (!favoritesDiv) return;
        favoritesDiv.innerHTML = '';

        if (favorites.length === 0) {
            favoritesDiv.innerHTML = '<p>Здесь пока пусто</p>';
            return;
        }

        favorites.forEach((book) => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.setAttribute('onclick', 'handleCardTap(this, event)');
            const bookAuthor = book.author || 'Неизвестный автор';
            card.innerHTML = `
                <button class="btn-like active" onclick="toggleLike('${book.title.replace(/'/g, "\'")}', '${bookAuthor.replace(/'/g, "\'")}', '${book.img}', this); event.stopPropagation();">
                    <i class="fas fa-heart"></i>
                </button>
                <img src="${book.img}" alt="${book.title}">
                <p>${book.title}</p>
                <div class="book-author">${bookAuthor}</div>
            `;
            favoritesDiv.appendChild(card);
        });
    }
</script>

</body>
</html>
